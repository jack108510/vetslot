<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up for Slot Alerts — Empty Slot</title>
  <meta name="description" content="Sign up for Empty Slot alerts and get emailed when discounted veterinary surgery openings become available.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;background:#f8fafc;color:#0f172a;min-height:100vh;-webkit-font-smoothing:antialiased}.nav{height:70px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{display:flex;align-items:center;gap:10px;text-decoration:none}.brand img{height:42px;width:auto;display:block}.nav a:not(.brand){font-size:14px;color:#475569;text-decoration:none;font-weight:700}.wrap{max-width:760px;margin:0 auto;padding:72px 20px;text-align:center}.card{background:#fff;border:1px solid #e2e8f0;border-radius:28px;box-shadow:0 24px 70px rgba(15,23,42,.08);padding:44px 34px}.badge{display:inline-flex;background:#ecfdf5;border:1px solid #bbf7d0;color:#047857;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;margin-bottom:18px}h1{font-size:clamp(34px,6vw,54px);letter-spacing:-.055em;line-height:1.02;margin-bottom:14px}.sub{font-size:17px;line-height:1.7;color:#64748b;max-width:560px;margin:0 auto 28px}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:14px;padding:14px 20px;text-decoration:none;font-weight:850}.primary{background:#0d9488;color:#fff}.secondary{background:#fff;color:#334155;border:1px solid #cbd5e1}.note{font-size:13px;color:#94a3b8;margin-top:18px}@media(max-width:560px){.nav{padding:0 16px}.brand img{height:36px}.wrap{padding:42px 16px}.card{padding:32px 20px}.actions{display:grid}.btn{width:100%}}
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="brand"><img src="assets/emptyslot-wordmark.png" alt="Empty Slot"></a>
    <a href="clinic.html">For Clinics</a>
  </nav>
  <main class="wrap">
    <section class="card">
      <div class="badge">Signup first</div>
      <h1>Slots are sent to signed-up pet owners first.</h1>
      <p class="sub">Sign up free and we’ll email you when a verified clinic posts a discounted last-minute surgery opening near you.</p>
      <div class="actions">
        <a class="btn primary" href="index.html#step1">Sign up for slot alerts</a>
        <a class="btn secondary" href="browse.html">Check current openings</a>
      </div>
      <p class="note">No account. No credit card. Unsubscribe anytime.</p>
    </section>
  </main>
</body>
</html>
